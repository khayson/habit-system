; A54: one small pool for Render's free instance (512 MB). The master runs as the image's
; non-root user, so no user or group lines.
[global]
error_log = /proc/self/fd/2
daemonize = no

[www]
listen = 127.0.0.1:9000
pm = dynamic
pm.max_children = 5
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 500
; The tick (A54) answers within about a minute.
request_terminate_timeout = 120s
catch_workers_output = yes
decorate_workers_output = no
clear_env = no
