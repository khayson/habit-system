; A54: production PHP settings.
expose_php = Off
display_errors = Off
log_errors = On
error_log = /proc/self/fd/2
memory_limit = 256M
; The tick runs the worker for up to about 50 seconds (A54).
max_execution_time = 110
; Avatar uploads (A20) and import files stay well under this.
upload_max_filesize = 12M
post_max_size = 12M
opcache.enable = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 96
opcache.max_accelerated_files = 20000
realpath_cache_size = 4096K
