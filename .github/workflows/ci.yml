name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: api (PHP 8.4, PostgreSQL 17)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: api
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: habit
          POSTGRES_PASSWORD: habit
          POSTGRES_DB: habit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U habit -d habit_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: habit_test
      DB_USERNAME: habit
      DB_PASSWORD: habit
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, pgsql, mbstring, intl, sodium, fileinfo, zip, gd
          ini-values: date.timezone=UTC, memory_limit=1G
          coverage: none
      - name: Cache Composer
        uses: actions/cache@v6
        with:
          path: ~/.composer/cache/files
          key: composer-${{ hashFiles('api/composer.lock') }}
      - name: Composer validate
        run: composer validate --strict
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Composer audit (fail on high/critical)
        run: composer audit --abandoned=report --ignore-severity=low --ignore-severity=medium
      - run: cp .env.example .env && php artisan key:generate
      - name: Pint
        run: vendor/bin/pint --test
      - name: Larastan
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress
      - name: Pest (real PostgreSQL)
        run: vendor/bin/pest

  compose:
    name: docker-compose config
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - run: docker compose config -q

  app:
    name: app (Flutter analyze + test)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          # Flutter 3.47.x is the confirmed toolchain (Phase 0 review, answer 4).
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Generated code is up to date
        run: |
          dart run build_runner build --delete-conflicting-outputs
          git diff --exit-code -- lib
      - name: Format
        # Generated *.g.dart is build_runner's output (80 columns), checked by the step above.
        run: |
          git ls-files -co --exclude-standard 'lib/*.dart' 'test/*.dart' 'integration_test/*.dart' 'tool/*.dart' |
             grep -v '\.g\.dart$' | xargs dart format --output=none --set-exit-if-changed
      - run: flutter analyze
      - run: flutter test

  e2e:
    name: e2e (real API + real sync engine)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: habit
          POSTGRES_PASSWORD: habit
          POSTGRES_DB: habit_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U habit -d habit_e2e"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: habit_e2e
      DB_USERNAME: habit
      DB_PASSWORD: habit
      E2E_DATABASE_URL: postgresql://habit:habit@127.0.0.1:5432/habit_e2e
      # Run from app/: the A10 closer, once, inline.
      E2E_CLOSE_CMD: php ../api/artisan habits:close-periods --sync
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, pgsql, mbstring, intl, sodium, fileinfo, zip, gd
          ini-values: date.timezone=UTC, memory_limit=1G
          coverage: none
      - name: Cache Composer
        uses: actions/cache@v6
        with:
          path: ~/.composer/cache/files
          key: composer-${{ hashFiles('api/composer.lock') }}
      - name: Boot the API
        working-directory: api
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          cp .env.example .env && php artisan key:generate
          php artisan migrate --force
          php artisan serve --host=127.0.0.1 --port=8000 > ../api-serve.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/api/v1/health && exit 0
            sleep 1
          done
          cat ../api-serve.log
          exit 1
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - name: Sync end-to-end
        working-directory: app
        run: |
          flutter pub get
          dart run tool/sync_e2e.dart http://127.0.0.1:8000/api/v1
      - name: API log on failure
        if: failure()
        run: cat api-serve.log || true
