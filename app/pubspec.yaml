name: habit
description: "Habit System mobile client (offline-first)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.4
  # A24: Flutter 3.47.x. CI pins the same version.
  flutter: ">=3.47.0 <3.48.0"

dependencies:
  # ^7.3.1, not ^7.3.2: flutter_local_notifications 22.x conflicts with 7.3.2 through dbus;
  # raise it again when the plugin allows.
  connectivity_plus: ^7.3.1
  dio: ^5.11.1
  drift: ^2.35.1
  drift_flutter: ^0.3.1
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.1
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  flutter_timezone: ^5.1.1
  go_router: ^18.0.2
  image_cropper: ^12.2.1
  image_picker: ^1.2.4
  intl: ^0.20.3
  path: ^1.9.1
  path_provider: ^2.1.6
  provider: ^6.1.5+1
  sqlite3: ^3.7.0
  timezone: ^0.11.1
  url_launcher: ^6.3.3
  uuid: ^4.6.0
  workmanager: ^0.10.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.1
  build_runner: ^2.16.1
  mocktail: ^1.0.5
  analyzer: ">=13.3.0 <14.5.0"
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/fonts/inter/LICENSE.txt
    # A20: the country picker's list (scripts/gen-countries.php; a test keeps it equal to the fixture).
    - assets/countries.json

  # Inter 4.1 variable font (SIL OFL 1.1), bundled: no runtime font downloads (offline-first).
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/inter/InterVariable.ttf
        - asset: assets/fonts/inter/InterVariable-Italic.ttf
          style: italic
